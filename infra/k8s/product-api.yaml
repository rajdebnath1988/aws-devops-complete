apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-api
  namespace: devops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-api
  template:
    metadata:
      labels:
        app: product-api
    spec:
      serviceAccountName: default
      containers:
        - name: product-api
          # CORRECT PLACEHOLDER MATCHING THE PIPELINE
          image: REPO_URI_PLACEHOLDER:IMAGE_TAG_PLACEHOLDER
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: product-api-svc
  namespace: devops-demo
spec:
  selector:
    app: product-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
