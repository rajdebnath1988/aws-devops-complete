name: DevSecOps Master Pipeline

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: my-devops-cluster

permissions:
  id-token: write      # For AWS OIDC
  contents: read       # To read the repo
  issues: write        # Allow ZAP to create issues
  checks: write        # Allow ZAP to add check runs

jobs:
  # ------------------------------------------------------------------
  # STAGE 1: Infrastructure (Check & Deploy CloudFormation)
  # ------------------------------------------------------------------
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Deploy ECR and SSM
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: DevOpsBaseInfra
          template: infra/cloudformation/01-ecr.yaml
          no-fail-on-empty-changeset: "1"

  # ------------------------------------------------------------------
  # STAGE 2: Build & Security Scan (Parallel for both services)
  # ------------------------------------------------------------------
  build-and-secure:
    needs: deploy-infra
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [product-api, shop-ui]
    steps:
      - uses: actions/checkout@v3

      # 1. SAST (Static Code Analysis) - Snyk
      - name: Snyk Security Scan
        uses: snyk/actions/python@master
        continue-on-error: true 
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: services/${{ matrix.service }}/requirements.txt

      # 2. Login to AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # 3. Build Docker Image
      - name: Build and Tag
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd services/${{ matrix.service }}
          docker build -t $REGISTRY/${{ matrix.service }}:${{ github.sha }} .

      # 4. Container Security Scanning - Trivy
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # 5. Push Image
      - name: Push to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $REGISTRY/${{ matrix.service }}:${{ github.sha }}

  # ------------------------------------------------------------------
  # STAGE 3: Deploy to EKS
  # ------------------------------------------------------------------
  deploy-k8s:
    needs: build-and-secure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update KubeConfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy Infrastructure Namespace
        run: kubectl apply -f infra/k8s/namespace.yaml

      # -------------------------------------------------------------
      # FIXED: Dynamically fetch Account ID to prevent "InvalidImageName"
      # -------------------------------------------------------------
      - name: Deploy Microservices and HPA
        run: |
          # 1. Fetch Account ID safely (Prevents crash if Secret is missing)
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          
          echo "Deploying with Registry: $ECR_REGISTRY"

          # 2. Replace URI Placeholders (Standardizes the format)
          sed -i "s|REPO_URI_PLACEHOLDER|$ECR_REGISTRY/product-api|g" infra/k8s/product-api.yaml
          sed -i "s|REPO_URI_PLACEHOLDER|$ECR_REGISTRY/shop-ui|g" infra/k8s/shop-ui.yaml
          
          # 3. Replace Image Tags
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${{ github.sha }}|g" infra/k8s/*.yaml
          
          # 4. Apply Manifests
          kubectl apply -f infra/k8s/product-api.yaml
          kubectl apply -f infra/k8s/shop-ui.yaml
          kubectl apply -f infra/k8s/hpa.yaml

      - name: Wait for Rollout
        run: kubectl rollout status deployment/shop-ui -n devops-demo

  # ------------------------------------------------------------------
  # STAGE 4: DAST (Dynamic Security Testing) - OWASP ZAP
  # ------------------------------------------------------------------
  dast-test:
    needs: deploy-k8s
    runs-on: ubuntu-latest
    # Define placeholder to silence editor warning
    env:
      TARGET_URL: "placeholder"
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get LoadBalancer URL
        run: |
           aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
           
           echo "Waiting for LoadBalancer..."
           sleep 15
           LB_URL=$(kubectl get svc shop-ui-lb -n devops-demo -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
           
           echo "LoadBalancer is at: $LB_URL"
           echo "TARGET_URL=http://$LB_URL" >> $GITHUB_ENV

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: ${{ env.TARGET_URL }}
          
          # FIXED: Removed 'rules_file_name' (it was pointing to a non-existent file)
          cmd_options: '-a'
          
          # FIXED: Added artifact_name to prevent "zap_scan" underscore error
          artifact_name: 'zap-scan-report'
          
          # Set to false to ensure you get the report even if warnings exist
          fail_action: false
          
          allow_issue_writing: false
