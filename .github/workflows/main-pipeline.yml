name: DevSecOps Master Pipeline

#on:
  #push:
    #branches: [ "main" ]

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: my-devops-cluster

permissions:
  id-token: write
  contents: read

jobs:
  # ------------------------------------------------------------------
  # STAGE 1: Infrastructure (Check & Deploy CloudFormation)
  # ------------------------------------------------------------------
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Deploy ECR and SSM
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: DevOpsBaseInfra
          template: infra/cloudformation/01-ecr.yaml
          no-fail-on-empty-changeset: "1"

  # ------------------------------------------------------------------
  # STAGE 2: Build & Security Scan (Parallel for both services)
  # ------------------------------------------------------------------
  build-and-secure:
    needs: deploy-infra
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [product-api, shop-ui]
    steps:
      - uses: actions/checkout@v3

      # 1. SAST (Static Code Analysis) - Snyk
      - name: Snyk Security Scan
        uses: snyk/actions/python@master
        continue-on-error: true # Don't block demo on vulnerability
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: services/${{ matrix.service }}/requirements.txt

      # 2. Login to AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # 3. Build Docker Image
      - name: Build and Tag
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd services/${{ matrix.service }}
          docker build -t $REGISTRY/${{ matrix.service }}:${{ github.sha }} .

      # 4. Container Security Scanning - Trivy
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Set to 1 to fail build on High vuln

      # 5. Push Image
      - name: Push to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $REGISTRY/${{ matrix.service }}:${{ github.sha }}

  # ------------------------------------------------------------------
  # STAGE 3: Deploy to EKS
  # ------------------------------------------------------------------
  deploy-k8s:
    needs: build-and-secure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update KubeConfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      # -------------------------------------------------------------
      # UPDATED: Deploy Namespace First
      # -------------------------------------------------------------
      - name: Deploy Infrastructure Namespace
        run: kubectl apply -f infra/k8s/namespace.yaml

      # -------------------------------------------------------------
      # UPDATED: Deploy Apps + HPA
      # -------------------------------------------------------------
      - name: Deploy Microservices and HPA
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          # 1. Dynamically replace Image Tags
          # This replaces the placeholder with the actual ECR URL in all YAML files
          sed -i "s|AWS_ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com|$ECR_REGISTRY|g" infra/k8s/*.yaml
          
          # This replaces 'IMAGE_TAG' with the GitHub Commit SHA
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g" infra/k8s/*.yaml
          
          # 2. Apply Microservices
          kubectl apply -f infra/k8s/product-api.yaml
          kubectl apply -f infra/k8s/shop-ui.yaml
          
          # 3. Apply Autoscaler Configuration
          kubectl apply -f infra/k8s/hpa.yaml

      - name: Wait for Rollout
        # Wait until the frontend is actually serving traffic before we scan it
        run: kubectl rollout status deployment/shop-ui -n devops-demo

  # ------------------------------------------------------------------
  # STAGE 4: DAST (Dynamic Security Testing) - OWASP ZAP
  # ------------------------------------------------------------------
  dast-test:
    needs: deploy-k8s
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get LoadBalancer URL
        run: |
           # Need to reconnect to cluster to get the dynamic LoadBalancer URL
           aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
           
           # Loop to wait for LoadBalancer IP/Hostname (sometimes takes a few seconds)
           echo "Waiting for LoadBalancer..."
           sleep 10
           LB_URL=$(kubectl get svc shop-ui-lb -n devops-demo -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
           
           echo "LoadBalancer is at: $LB_URL"
           echo "TARGET_URL=http://$LB_URL" >> $GITHUB_ENV

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: ${{ env.TARGET_URL }}
          rules_file_name: '.zap/rules.tsv' 
          cmd_options: '-a'
